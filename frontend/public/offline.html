<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="theme-color" content="#0025BA" />
        <title>Offline - Twindix Admin</title>
        <style>
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }
            body {
                font-family: 'Roboto', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
                background-color: #F6F6F6;
                min-height: 100vh;
                display: flex;
                align-items: center;
                justify-content: center;
                padding: 20px;
            }
            .container {
                text-align: center;
                background-color: #FFFFFF;
                padding: 40px;
                border-radius: 14px;
                box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
                max-width: 400px;
                width: 100%;
            }
            .icon {
                width: 80px;
                height: 80px;
                margin: 0 auto 24px;
                background-color: #F6F6F6;
                border-radius: 50%;
                display: flex;
                align-items: center;
                justify-content: center;
            }
            .icon svg {
                width: 40px;
                height: 40px;
                color: #0025BA;
            }
            h1 {
                color: #0025BA;
                font-size: 24px;
                font-weight: 700;
                margin-bottom: 12px;
            }
            p {
                color: #6B7280;
                font-size: 16px;
                line-height: 1.5;
                margin-bottom: 24px;
            }
            .retry-button {
                background-color: #1356BC;
                color: #FFFFFF;
                border: none;
                padding: 12px 32px;
                font-size: 16px;
                font-weight: 500;
                border-radius: 14px;
                cursor: pointer;
                transition: background-color 0.2s ease;
            }
            .retry-button:hover {
                background-color: #0025BA;
            }
            .retry-button:active {
                transform: scale(0.98);
            }
        </style>
    </head>
    <body>
        <div class="container">
            <div class="icon">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M18.364 5.636a9 9 0 010 12.728m0 0l-2.829-2.829m2.829 2.829L21 21M15.536 8.464a5 5 0 010 7.072m0 0l-2.829-2.829m-4.243 2.829a5 5 0 01-7.072-7.072m7.072 7.072l2.829-2.829m-7.072-4.243a5 5 0 017.072 0m0 0L8.464 8.464M3 3l3.5 3.5M21 21l-3.5-3.5" />
                </svg>
            </div>
            <h1>You are offline</h1>
            <p>It looks like you've lost your internet connection. Please check your network and try again.</p>
            <button class="retry-button" onclick="window.location.reload()">
                Retry
            </button>
        </div>
    </body>
</html>
